<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffcfda" />
    <title>喵喵小屋 Cat Nurture</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-label="喵喵小屋養成遊戲">
      <section id="playTab" class="play-tab" aria-label="貓咪主畫面">
        <section id="roomViewport" class="room-viewport" aria-live="polite">
          <div id="roomScene" class="room-scene living-room"></div>
        </section>

        <nav class="room-nav" aria-label="空間切換">
          <button id="previousRoom" class="ghost-button" type="button" aria-label="上一個空間">‹</button>
          <button id="nextRoom" class="ghost-button" type="button" aria-label="下一個空間">›</button>
        </nav>
      </section>

      <section id="settingsTab" class="settings-tab is-hidden" aria-label="設定">
        <div class="settings-card">
          <p class="eyebrow">設定</p>
          <h1>貓咪管理</h1>
          <p class="subtitle">名字、領養、送養與空間資訊都放在這裡；主畫面只保留貓咪活動。</p>
        </div>

        <section class="stats-grid" aria-label="貓咪狀態統計">
          <article>
            <span id="catCount">0</span>
            <small>已領養 / 100</small>
          </article>
          <article>
            <span id="roomCount">1</span>
            <small>空間數</small>
          </article>
          <article>
            <span id="currentRoomLabel">客廳</span>
            <small>目前空間</small>
          </article>
        </section>

        <section class="settings-card action-card" aria-label="領養控制">
          <div>
            <h2 id="roomName">客廳</h2>
            <p id="roomMeta">第 1 / 1 個空間，每個空間最多 7 隻</p>
          </div>
          <label class="batch-label">
            批量領養數量
            <input id="batchCount" type="number" min="1" max="20" value="3" inputmode="numeric" />
          </label>
          <button id="adoptBatchButton" class="primary-button" type="button">＋ 批量領養貓咪</button>
          <p id="adoptionNotice" class="notice">送養貓咪會把牠從名冊移除；送養不是買賣，獲得費用為 0。</p>
        </section>

        <section class="cat-panel" aria-label="貓咪清單">
          <h2>貓咪名冊</h2>
          <p>可隨時改名，也可以送養。送養費用固定為 0，代表只是幫貓咪找到新家。</p>
          <div id="catList" class="cat-list"></div>
        </section>
      </section>

      <nav class="tab-bar" aria-label="主要分頁">
        <button id="playTabButton" class="tab-button is-active" type="button">🐾 貓咪</button>
        <button id="settingsTabButton" class="tab-button" type="button">⚙️ 設定</button>
      </nav>
    </main>

    <template id="catTemplate">
      <article class="cat-card">
        <div class="mini-cat" aria-hidden="true"><span></span></div>
        <div>
          <label>
            名字
            <input class="cat-name-input" maxlength="12" />
          </label>
          <small class="cat-location"></small>
        </div>
        <button class="send-away-button" type="button">送養（獲得費用 0）</button>
      </article>
    </template>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
